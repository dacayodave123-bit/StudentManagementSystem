<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Events</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            /* Two-color black and red background */
            background: linear-gradient(
                135deg,
                #000000 0%,
                #000000 50%,
                #8b0000 50%,
                #ff0000 100%
            );

            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Main content card */
        main {
            width: 100%;
            max-width: 700px;

            background: rgba(0, 0, 0, 0.88);

            padding: 45px 35px;

            border: 2px solid #ff0000;
            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.4),
                0 10px 40px rgba(0, 0, 0, 0.8);
        }

        /* Heading */
        h1 {
            color: #ff3333;
            font-size: 36px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Description */
        .description {
            color: #dddddd;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Button container */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Buttons */
        button {
            min-width: 160px;
            min-height: 50px;

            padding: 12px 22px;

            background-color: #d40000;
            color: #ffffff;

            border: 2px solid #ff4444;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background-color 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }

        /* Mouse hover */
        button:hover {
            background-color: #ff0000;
            transform: translateY(-3px);

            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5);
        }

        /* Keyboard focus */
        button:focus-visible {
            outline: 4px solid #ffffff;
            outline-offset: 4px;
        }

        /* Button press */
        button:active {
            transform: translateY(0);
        }

        /* Message */
        #message {
            margin-top: 30px;

            padding: 15px;

            background-color: #1a1a1a;

            border-left: 5px solid #ff0000;
            border-radius: 8px;

            color: #ffffff;

            font-size: 20px;
            font-weight: bold;
        }

        /* Small red line decoration */
        .line {
            width: 80px;
            height: 4px;

            background-color: #ff0000;

            margin: 0 auto 25px;

            border-radius: 5px;
        }

        /* Mobile design */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            main {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1>JavaScript Event Example</h1>

        <div class="line"></div>

        <p class="description">
            Welcome to Event Driven Programming!
            <br>
            Click the buttons below to see different JavaScript events.
        </p>

        <div class="buttons" aria-label="JavaScript event controls">

                <button id="greet" type="button" aria-label="Hii">
                    Hii
                </button>

                <button id="greet" type="button" aria-label="Greet User">
                    Greet User
                </button>

            <button id="changeBtn" type="button" aria-label="Change Message">
                Change Message
            </button>

        </div>

        <p id="message" role="status" aria-live="polite">
            Original Message
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
